<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Online Work Guide</title>

<link rel="icon" type="image/png" href="logo.png">

<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box;font-family:'Hind Siliguri',sans-serif}

body{
margin:0;min-height:100vh;
display:flex;justify-content:center;align-items:center;
background:radial-gradient(circle at top,#0f1b3d,#050814);
overflow:hidden;color:#fff;
}

/* animated gradient blobs */
.bg{
position:fixed;inset:-50%;
background:
radial-gradient(circle at 20% 30%,rgba(0,255,255,.15),transparent 40%),
radial-gradient(circle at 80% 70%,rgba(0,140,255,.15),transparent 40%);
animation:move 18s linear infinite;
z-index:-1;
}
@keyframes move{
0%{transform:translate(0,0)}
50%{transform:translate(10%,5%)}
100%{transform:translate(0,0)}
}

.box{
width:100%;max-width:420px;
background:rgba(15,25,60,.85);
backdrop-filter:blur(12px);
border-radius:20px;
padding:28px;
text-align:center;
box-shadow:0 0 40px rgba(0,0,0,.6);
animation:pop .7s ease;
}

@keyframes pop{from{transform:scale(.8);opacity:0}to{transform:scale(1);opacity:1}}

h1{
font-size:26px;margin-bottom:8px;
animation:fadeUp 1s ease;
}
p{
opacity:.9;font-size:15px;animation:fadeUp 1.2s ease;
}
@keyframes fadeUp{from{transform:translateY(15px);opacity:0}to{transform:translateY(0);opacity:1}}

input,button{
width:100%;padding:13px;border:none;border-radius:12px;
margin-top:12px;font-size:16px;
}

input{
background:#070c25;color:#fff;border:1px solid #2c3d88;
}

button{
background:linear-gradient(135deg,#00ffd5,#00b0ff);
color:#000;font-weight:700;cursor:pointer;
transition:.25s;
}
button:hover{transform:scale(1.04);box-shadow:0 0 15px #00ffd5}

footer{
margin-top:18px;font-size:13px;opacity:.85
}
footer a{color:#7dd3fc;text-decoration:none;margin:0 6px}
</style>
</head>

<body>

<div class="bg"></div>

<div class="box">
<h1>🏠 ঘরে বসে অনলাইন কাজ শিখতে চান? 💻</h1>

<p>✨ সহজ কাজের গাইড পেতে নিচের ফর্মটি পূরণ করুন  
আমাদের টিম খুব দ্রুত যোগাযোগ করবে 🤝</p>

<form onsubmit="sendWhatsApp(event)">
<input type="text" id="name" placeholder="👤 আপনার নাম" required>
<input type="tel" id="phone" placeholder="📱 WhatsApp নাম্বার (English only)"
oninput="onlyEnglishNumber(this)" required>
<button type="submit">🚀 তথ্য পেতে চাই</button>
</form>

<footer>
<a href="privacy.html">Privacy Policy</a> |
<a href="terms.html">Terms & Conditions</a> |
<a href="contact.html">Contact Us</a>
</footer>
</div>

<script>
function sendWhatsApp(e){
 e.preventDefault();
 let name=document.getElementById("name").value;
 let phone=document.getElementById("phone").value;

 let msg=`Hello, আমি কাজের তথ্য নিতে চাই 🙂
Name: ${name}
Phone: ${phone}`;

 window.location.href="https://wa.me/8801641117607?text="+encodeURIComponent(msg);
}
function onlyEnglishNumber(input){
  input.value = input.value.replace(/[^0-9]/g, '');
}
</script>

</body>
</html>
